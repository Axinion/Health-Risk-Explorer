version: "3.8"

services:
  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      # Mount source code for live reload during development
      - .:/app
      # But keep the trained models from the build step
      - model_data:/app/model
      - training_data:/app/data
    restart: unless-stopped

volumes:
  model_data:
  training_data:
